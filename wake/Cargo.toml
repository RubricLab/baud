[package]
name = "wake"
version = "0.1.0"
edition = "2021"
publish = false
description = "baud's wake relay: opens a sealed ticket, asks Apple to wake that iPhone, keeps nothing"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
hmac = "0.12"
hpke = "0.14"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
