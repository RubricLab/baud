[package]
name = "baud-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "baud's app logic on peer: conversations, feeds, sealing, delivery, carrying, files"
publish = false

[dependencies]
peer.workspace = true
tokio.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
base64.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot = "0.12"
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

# Android has no system libcrypto for SQLCipher to link: build OpenSSL in. Features unify, so
# peer's rusqlite gets the same.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
